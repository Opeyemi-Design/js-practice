<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/01-general/opeyemi-favicon-face.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Opeyemi Adetifa</title>
    <link rel="stylesheet" href="/foundation.css" />
    <link rel="stylesheet" href="/redesign.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/pages.css" />
    <script src="/theme.js"></script>
    <script src="/header-and-footer-loader.js"></script>

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Opeyemi Adetifa's Design Portfolio" />
    <meta
      property="og:description"
      content="A product designer with 7 years of experience across e-commerce, ad tech, cybersecurity, and online media publishing."
    />
    <meta
      property="og:image"
      content="https://opeyemiadetifa.com/images/01-general/link-thumnail.png"
    />
    <meta property="og:url" content="https://opeyemiadetifa.com" />
    <meta property="og:type" content="website" />
  </head>

  <body class="contact-page">
    <main class="page-main">
      <section class="page-hero normal-container">
        <p class="page-eyebrow">Contact</p>
        <h1 class="page-heading">Let’s talk.</h1>
        <p class="page-intro">
          I’m available for full-time, contract and freelance opportunities. I’d love to hear from
          you.
        </p>
      </section>
      <section class="normal-container">
        <div class="personal-card contact-card">
          <h2>Get in touch</h2>
          <p>
            Send me a message on
            <a
              href="https://www.linkedin.com/in/opeyemiadetifa/"
              target="_blank"
              rel="noopener noreferrer"
              >LinkedIn</a
            >
            or email me at
            <a href="mailto:opeyemiadetifa17@gmail.com">opeyemiadetifa17@gmail.com</a>.
          </p>
          <div class="contact-actions">
            <button
              id="copy-email-address"
              type="button"
              class="btn btn--filled btn--large"
              data-email="opeyemiadetifa17@gmail.com"
            >
              <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3" />
              </svg>
              <span class="copy-button-label">Copy email address</span>
            </button>
          </div>
          <p class="copy-status visually-hidden" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="/ambience.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
