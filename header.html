<header class="primary-header">
  <div class="header-shell">
    <a class="wordmark" href="/" aria-label="Opeyemi, home">
      <span class="wordmark__graphic" aria-hidden="true"></span>
    </a>
    <!-- Main navigation -->
    <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
      <ul class="nav-list" role="list">
        <li><a class="nav-link" href="/#work">Work</a></li>
        <li><a class="nav-link" href="/case-studies.html">Case studies</a></li>
        <li><a class="nav-link" href="/explorations.html">Explorations</a></li>
        <li><a class="nav-link" href="/about-me.html">About</a></li>
        <li><a class="nav-link" href="/contact-me.html">Contact</a></li>
      </ul>
    </nav>
    <!-- Appearance selector and mobile menu -->
    <div class="header-actions">
      <div class="theme-switcher segmented-control" role="group" aria-label="Appearance">
        <button
          class="btn btn--ghost btn--icon btn--small"
          type="button"
          data-theme-choice="light"
          aria-label="Light theme"
          data-tooltip="Light"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>
        <button
          class="btn btn--ghost btn--icon btn--small"
          type="button"
          data-theme-choice="dark"
          aria-label="Dark theme"
          data-tooltip="Dark"
        >
          <svg viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" /></svg>
        </button>
        <button
          class="btn btn--ghost btn--icon btn--small"
          type="button"
          data-theme-choice="system"
          aria-label="System theme"
          data-tooltip="System"
        >
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <path d="M8 21h8m-4-4v4" />
          </svg>
        </button>
        <button
          class="btn btn--ghost btn--icon btn--small"
          type="button"
          data-theme-choice="seasonal"
          aria-label="Seasonal theme"
          data-tooltip="Seasonal"
        >
          <svg viewBox="0 0 24 24">
            <path d="M20 4C9 4 4 8 4 15a5 5 0 0 0 5 5c7 0 11-5 11-16ZM4 20c3-4 6-7 12-10" />
          </svg>
        </button>
      </div>
      <button
        class="mobile-nav-toggle btn btn--ghost btn--icon btn--small"
        type="button"
        aria-controls="primary-navigation"
        aria-expanded="false"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
